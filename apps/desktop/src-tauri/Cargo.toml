[package]
name = "repakhub"
version = "0.1.0"
description = "Universal desktop game library manager"
authors = ["RepakHub contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repakhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde_json = "1.0.154"
tauri-plugin-dialog = "2"
dunce = "1.0.5"
tauri-plugin-opener = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56"

# Proc-macros and build scripts run on the build machine; stripping them breaks proc-macro dylibs on
# recent macOS linkers ("mis-aligned LINKEDIT string pool"). The shipped binary is still stripped.
[profile.release.build-override]
strip = false
