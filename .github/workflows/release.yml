name: Release

# Builds installers for Windows, Linux and macOS when a version tag (v0.1.0, ...) is pushed, and publishes
# them as a GitHub release (not a pre-release: the updater reads `releases/latest`). Tags must point at a commit on `main` and match the app version.
# Actions are pinned to full commit SHAs because this workflow can write releases; bump them deliberately.
on:
  push:
    tags: ["v*"]

# Read-only by default; only `publish` can write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag matches the app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match app version $version"; exit 1; }

  # Builds with read-only access: no token in this job, so a compromised build dependency cannot touch releases.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      # ponytail: unsigned builds; Windows SmartScreen warns until a code-signing certificate is added.
      - run: pnpm --filter desktop tauri build

      # The updater installs macOS updates from a tarball of the .app (Windows uses the NSIS installer,
      # Linux the AppImage, both already built). Signed later, in `publish`, which holds the key.
      - name: macOS updater archive
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          version=$(jq -r .version ../../../tauri.conf.json)
          tar -czf "macos/RepakHub_${version}_aarch64.app.tar.gz" -C macos RepakHub.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz

  # Only this job can write and only it sees the updater signing key. It runs no project code: it signs
  # what the build jobs produced (with the pinned Tauri CLI, install scripts off), writes the updater
  # feed with a Node built-ins script, and publishes after every platform succeeded.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Sign updater artifacts and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No updater signing key configured: publishing installers without the self-update feed."
            exit 0
          fi
          npm install --global --ignore-scripts @tauri-apps/cli@2.12.6
          find installers -type f \( -name '*.app.tar.gz' -o -name '*-setup.exe' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do tauri signer sign "$f" > /dev/null; done
          node scripts/updater-manifest.mjs installers "${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > installers/latest.json
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Artifacts keep their bundle subfolders (msi/, deb/, ...): upload the files, not the folders.
          mapfile -t files < <(find installers -type f)
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RepakHub $GITHUB_REF_NAME" \
            --notes "Early (0.x), unsigned build. Windows: SmartScreen may warn, choose \"More info\", then \"Run anyway\". macOS (Apple silicon): right-click the app, choose Open, then confirm. See docs/PLAN.md for what this release includes."
